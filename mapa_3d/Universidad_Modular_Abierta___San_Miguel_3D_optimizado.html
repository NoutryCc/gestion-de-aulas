// ---------- optimización: fusiona toda la geometría estática (miles de draw calls -> unos pocos) ----------
(function(){
 scene.updateMatrixWorld(true);
 const B=new Map(),old=[],v=new T.Vector3(),nm=new T.Matrix3();
 scene.traverse(o=>{
  if(o.isInstancedMesh){o.frustumCulled=false;return}   // r128 recorta mal las instancias
  if(!o.isMesh)return;
  const arr=Array.isArray(o.material),mats=arr?o.material:[o.material];
  if(!mats.every(m=>m&&m.isMeshStandardMaterial))return;
  const g=o.geometry,P=g.attributes.position,N=g.attributes.normal,U=g.attributes.uv,ix=g.index,W=o.matrixWorld,flip=W.determinant()<0,
   cnt=ix?ix.count:P.count,grs=arr?g.groups:[{start:0,count:cnt,materialIndex:0}],
   cx=Math.floor(W.elements[12]/50),cz=Math.floor(W.elements[14]/50);
  nm.getNormalMatrix(W);old.push(o);
  grs.forEach(gr=>{
   const m=mats[gr.materialIndex],key=m.uuid+(o.castShadow?'c':'-')+(o.receiveShadow?'r':'-')+cx+','+cz;
   let b=B.get(key);if(!b){b={m,c:o.castShadow,r:o.receiveShadow,p:[],n:[],u:[],i:[],n0:0};B.set(key,b)}
   const map=new Map(),tri=[];
   for(let k=gr.start,e=Math.min(gr.start+gr.count,cnt);k<e;k++){
    const vi=ix?ix.getX(k):k;let ni=map.get(vi);
    if(ni===undefined){ni=b.n0++;map.set(vi,ni);
     v.fromBufferAttribute(P,vi).applyMatrix4(W);b.p.push(v.x,v.y,v.z);
     v.fromBufferAttribute(N,vi).applyMatrix3(nm).normalize();b.n.push(v.x,v.y,v.z);
     b.u.push(U.getX(vi),U.getY(vi))}
    tri.push(ni)}
   for(let k=0;k<tri.length;k+=3)flip?b.i.push(tri[k],tri[k+2],tri[k+1]):b.i.push(tri[k],tri[k+1],tri[k+2]);
  })});
 old.forEach(o=>o.parent&&o.parent.remove(o));
 B.forEach(b=>{const g=new T.BufferGeometry();
  g.setAttribute('position',new T.Float32BufferAttribute(b.p,3));g.setAttribute('normal',new T.Float32BufferAttribute(b.n,3));g.setAttribute('uv',new T.Float32BufferAttribute(b.u,2));
  g.setIndex(new T.BufferAttribute(b.n0>65535?new Uint32Array(b.i):new Uint16Array(b.i),1));g.computeBoundingSphere();
  const m=new T.Mesh(g,b.m);m.castShadow=b.c;m.receiveShadow=b.r;m.matrixAutoUpdate=false;scene.add(m)});
})();

let last=performance.now(),wasR=false,ema=16,cool=0,fr=0;
(function loop(t){requestAnimationFrame(loop);const dt=Math.min((t-last)/1000,.1);last=t;
  if(mode=='fly'){dirty=true;tw.t+=dt/2;const k=Math.min(tw.t,1),e=k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2;
    cam.position.lerpVectors(tw.p0,tw.d.p,e);cam.quaternion.copy(tw.q0).slerp(tw.d.q,e);cam.fov=tw.f0+(tw.d.fov-tw.f0)*e;cam.updateProjectionMatrix();
    if(k>=1){const v=tw.v;if(v.type=='orbit'){Object.assign(O,{th:v.th,ph:v.ph,dist:v.dist});O.tgt.set(...v.tgt);mode='orbit'}else{eu.setFromQuaternion(tw.d.q,'YXZ');L.yaw=eu.y;L.pitch=eu.x;L.pos.copy(tw.d.p);mode='look'}}}
  else if(dirty&&mode=='orbit'){const q=O.tgt;cam.position.set(q.x+O.dist*Math.cos(O.ph)*Math.sin(O.th),q.y+O.dist*Math.sin(O.ph),q.z+O.dist*Math.cos(O.ph)*Math.cos(O.th));cam.lookAt(q)}
  else if(dirty){cam.position.copy(L.pos);cam.rotation.set(L.pitch,L.yaw,0)}
  if(!dirty){wasR=false;return}            // escena quieta: no se vuelve a dibujar
  R.render(scene,cam);dirty=false;
  // si el equipo no da la talla, baja la resolución interna poco a poco
  if(wasR&&dt<.08&&++fr>60){ema+=(dt*1e3-ema)*.08;if((cool-=dt)<=0&&ema>26&&pr>.75){pr=Math.max(.75,pr-.25);R.setPixelRatio(pr);R.setSize(innerWidth,innerHeight);R.render(scene,cam);ema=16;cool=1.5}}
  wasR=true})(last);
